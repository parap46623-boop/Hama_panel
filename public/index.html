<!doctype html><html lang="ar" dir="rtl"><meta name="viewport" content="width=device-width,initial-scale=1"><title>License Control</title><style>body{font-family:system-ui;background:#0b0d12;color:#eee;max-width:1000px;margin:auto;padding:18px}.card{background:#151922;border:1px solid #292f3a;border-radius:18px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{font-size:14px}.stat b{display:block;font-size:28px}input,select,button{padding:11px;border-radius:10px;border:1px solid #333;background:#0d1016;color:#fff;margin:4px}.primary{background:#5b35d5}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #292f3a;text-align:right}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}}</style><body><div class=card><h1>⚡ License Control</h1><p>Normal / VIP</p></div><div class=grid><div class="card stat">Total<b id=t>0</b></div><div class="card stat">Active<b id=a>0</b></div><div class="card stat">VIP<b id=v>0</b></div><div class="card stat">Revoked<b id=r>0</b></div></div><div class=card><h2>إنشاء Key</h2><input id=tok type=password placeholder="Admin Token"><select id=typ><option value=normal>Normal</option><option value=vip>VIP</option></select><input id=days type=number value=30 min=1><button class=primary onclick=createKey()>إنشاء</button><pre id=out></pre></div><div class=card><h2>Keys</h2><button onclick=load()>تحديث</button><table><thead><tr><th>Key</th><th>Type</th><th>Status</th><th>Expires</th><th>Device</th></tr></thead><tbody id=rows></tbody></table></div><script>const H=()=>({'Authorization':'Bearer '+tok.value});async function createKey(){let x=await(await fetch('/api/admin/keys',{method:'POST',headers:{...H(),'Content-Type':'application/json'},body:JSON.stringify({days:+days.value,type:typ.value})})).json();out.textContent=x.success?`Key: ${x.key}\\nType: ${x.type}\\nExpires: ${x.expires_at}`:x.error;load()}async function load(){let x=await(await fetch('/api/admin/keys',{headers:H()})).json();t.textContent=x.length;a.textContent=x.filter(z=>z.status==='active').length;v.textContent=x.filter(z=>z.type==='vip').length;r.textContent=x.filter(z=>z.status==='revoked').length;rows.innerHTML=x.map(z=>`<tr><td>${z.key}</td><td>${z.type}</td><td>${z.status}</td><td>${z.expires_at}</td><td>${z.device_id||'—'}</td></tr>`).join('')}load()</script></body></html>
